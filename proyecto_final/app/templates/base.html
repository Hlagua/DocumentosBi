<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Redes neuronales · Financial_ijs{% endblock %}</title>
  <style>
    :root { --azul:#1f4e79; --azul2:#2e75b6; --gris:#f3f5f8; --borde:#d6dde6; --texto:#1d2733; --rojo:#b3261e; --verde:#1e7b45; --ambar:#8a5a00; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI", Arial, sans-serif; color:var(--texto); background:var(--gris); }
    header { background:var(--azul); color:#fff; padding:14px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
    header a { color:#fff; text-decoration:none; font-weight:600; }
    header .marca { font-size:18px; font-weight:400; }   /* el título es un enlace al dashboard de S1, pero se ve igual que antes */
    main { max-width:1100px; margin:24px auto; padding:0 16px; }
    .tarjeta { background:#fff; border:1px solid var(--borde); border-radius:8px; padding:20px; margin-bottom:18px; }
    h1 { font-size:22px; margin:0 0 6px; } h2 { font-size:18px; margin:0 0 10px; }
    .sub { color:#5a6878; margin:0 0 14px; }
    .rejilla { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
    input[type=text] { width:100%; padding:8px 10px; border:1px solid var(--borde); border-radius:6px; font-size:14px; }
    input.mal { border-color:var(--rojo); background:#fff5f5; }
    .error { color:var(--rojo); font-size:12px; margin-top:3px; }
    .ayuda { color:#6b7785; font-size:11px; margin-top:2px; }
    button { background:var(--azul2); color:#fff; border:0; border-radius:6px; padding:10px 22px; font-size:15px; cursor:pointer; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { border-bottom:1px solid var(--borde); padding:6px 8px; text-align:left; }
    th { background:#eef2f7; }
    .barra { height:16px; background:var(--azul2); border-radius:3px; }
    .clase { font-size:24px; font-weight:700; color:var(--azul); }
    .aviso { color:var(--ambar); font-size:13px; }
    .ok { color:var(--verde); font-size:13px; }
    .vector { font-family:Consolas, monospace; font-size:12px; word-break:break-all; background:#f7f9fb; padding:8px; border-radius:6px; }
    img { max-width:100%; }
    .frontera { background:#fff7e6; border:1px solid #e6b450; border-left:5px solid #e69f00; border-radius:6px; padding:10px 12px; margin:10px 0; font-size:14px; }
    .etiqueta-frontera { background:#e69f00; color:#fff; border-radius:4px; padding:1px 6px; font-size:11px; margin-left:4px; }
    .dos { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:16px; align-items:start; margin-bottom:12px; }
    .kpis { margin-top:12px; }
    .kpi { background:#f7f9fb; border:1px solid var(--borde); border-radius:8px; padding:10px 12px; }
    .kpi span { display:block; font-size:12px; color:#5a6878; } .kpi b { display:block; font-size:22px; color:var(--azul); } .kpi small { color:#5a6878; font-size:11px; }
    .cadena { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
    .cadena div { border:1px solid var(--borde); border-left:4px solid var(--azul2); border-radius:6px; padding:8px 10px; font-size:13px; }
    .cadena div.activo { border-left-color:#1e7b45; background:#f1faf4; }
    .cadena span { display:block; color:#5a6878; font-size:12px; margin-top:3px; }
    a.boton { display:inline-block; background:var(--azul2); color:#fff; padding:8px 14px; border-radius:6px; text-decoration:none; margin-top:8px; }
    /* Ventana modal (elemento <dialog> nativo): se cierra con la X, con Esc o con un clic en el fondo oscuro */
    button.boton-modal { background:#1e7b45; color:#fff; border:0; border-radius:6px; padding:10px 22px; font:inherit; cursor:pointer; }
    button.boton-modal:hover, button.boton-modal:focus-visible { background:#17623a; }
    button.secundario { background:#fff; color:var(--azul); border:1px solid var(--borde); }
    button.secundario:hover, button.secundario:focus-visible { background:#eef2f7; }
    dialog.modal { border:0; border-radius:10px; padding:0; width:min(980px, 94vw); max-height:90vh; color:var(--texto); box-shadow:0 24px 70px rgba(0,0,0,.4); }
    dialog.modal[open] { display:flex; flex-direction:column; }
    dialog.modal::backdrop { background:rgba(15,25,40,.6); }
    .modal-cab { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 20px 12px; border-bottom:1px solid var(--borde); }
    .modal-cab h2 { margin:0 0 4px; } .modal-cab .sub { margin:0; }
    .modal-x { background:transparent; color:#5a6878; font-size:28px; line-height:1; padding:0 8px; }
    .modal-x:hover, .modal-x:focus-visible { background:transparent; color:var(--rojo); }
    .modal-cuerpo { padding:16px 20px 22px; overflow:auto; }
    form.modal-form { display:flex; flex-direction:column; min-height:0; flex:1 1 auto; }   /* el cuerpo se desplaza y el pie con los botones queda a la vista */
    .modal-pie { display:flex; gap:10px; align-items:center; padding:12px 20px; border-top:1px solid var(--borde); background:#f7f9fb; border-radius:0 0 10px 10px; }
    .modal-pie p { margin:0; }
    body:has(dialog[open]) { overflow:hidden; }
    @media (max-width:640px) { table { display:block; overflow-x:auto; max-width:100%; } }   /* celular: la tabla se desplaza en vez de ensanchar la página */
  </style>
</head>
<body>
  <header>
    <a class="marca" href="/">Redes neuronales · Banco Financial_ijs</a>
    <a href="/red/S1">Dashboard de la red</a>
    <a href="/playground/S1">Playground</a>
    <a href="/historial">Historial de predicciones</a>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
  <script>
  // Abrir/cerrar ventanas modales. data-abrir="modal-ingreso" abre #modal-ingreso y deja el enlace "#ingreso".
  (function () {
    function abrir(id) {
      var d = document.getElementById(id);
      if (d && d.tagName === 'DIALOG' && !d.open && d.showModal) d.showModal();
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-abrir]');
      if (a) {
        var id = a.getAttribute('data-abrir');
        abrir(id);
        history.replaceState(null, '', '#' + id.replace('modal-', ''));
        return;
      }
      var c = e.target.closest('[data-cerrar]');
      if (c) { c.closest('dialog').close(); return; }
      if (e.target.tagName === 'DIALOG' && !e.target.hasAttribute('data-sin-fondo')) e.target.close();   // clic en el fondo oscuro (los formularios no se cierran así)
    });
    document.addEventListener('close', function (e) {         // al cerrar, se quita el "#datos" de la dirección
      if (e.target.tagName === 'DIALOG') history.replaceState(null, '', location.pathname + location.search);
    }, true);
    if (location.hash.length > 1) abrir('modal-' + location.hash.slice(1));
  })();
  </script>
</body>
</html>
